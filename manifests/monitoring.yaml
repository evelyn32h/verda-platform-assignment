apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: monitoring
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  version: 90.1.2
  targetNamespace: monitoring
  createNamespace: true
  timeout: 900s
  failurePolicy: abort
  backOffLimit: 2
  valuesContent: |-
    fullnameOverride: monitoring
    alertmanager:
      enabled: false
    defaultRules:
      create: false
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      service:
        type: ClusterIP
      ingress:
        enabled: false
      persistence:
        enabled: true
        storageClassName: local-path
        size: 2Gi
      nodeSelector:
        kubernetes.io/hostname: verda-k3s-server
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: monitoring
      defaultDashboardsTimezone: UTC
    prometheus:
      service:
        type: ClusterIP
      ingress:
        enabled: false
      prometheusSpec:
        replicas: 1
        retention: 2d
        retentionSize: 4GB
        nodeSelector:
          kubernetes.io/hostname: verda-k3s-server
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi
    prometheusOperator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
