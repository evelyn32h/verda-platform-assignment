apiVersion: v1
kind: ConfigMap
metadata:
  name: verda-platform-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  verda-platform.json: |
    {
      "uid": "verda-platform",
      "title": "Verda Platform Overview",
      "tags": ["verda", "platform"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "timezone": "utc",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {"id":1,"title":"Ready nodes (expected: 2)","type":"stat","gridPos":{"h":5,"w":8,"x":0,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})","instant":true}]},
        {"id":2,"title":"Available app replicas (expected: 2)","type":"stat","gridPos":{"h":5,"w":8,"x":8,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"kube_deployment_status_replicas_available{namespace=\"demo\",deployment=\"demo\"}","instant":true}]},
        {"id":3,"title":"Running pods","type":"stat","gridPos":{"h":5,"w":8,"x":16,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_pod_status_phase{phase=\"Running\"})","instant":true}]},
        {"id":4,"title":"Node CPU used (%)","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":5},"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100}},"targets":[{"refId":"A","expr":"100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))","legendFormat":"{{instance}}"}]},
        {"id":5,"title":"Node memory used (%)","type":"timeseries","gridPos":{"h":8,"w":12,"x":12,"y":5},"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100}},"targets":[{"refId":"A","expr":"100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)","legendFormat":"{{instance}}"}]},
        {"id":6,"title":"Node root filesystem used (%)","type":"timeseries","gridPos":{"h":8,"w":24,"x":0,"y":13},"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100}},"targets":[{"refId":"A","expr":"100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"rootfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"rootfs\"})","legendFormat":"{{instance}}"}]}
      ]
    }
