apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-content
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  index.html: '<!doctype html>

    <html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Verda Platform</title>

    <style>body{font:18px system-ui;background:#102b28;color:#eefbf6;max-width:760px;margin:12vh
    auto;padding:24px}small{color:#84d6b5}h1{font-size:48px}p{line-height:1.6}code{color:#84d6b5}</style>

    <small>VERDA / PLATFORM ENGINEERING</small><h1>The platform is running.</h1>

    <p>This sample app runs with two replicas on a two-node Kubernetes cluster, behind
    Traefik ingress.</p>

    <p>Cross-node traffic uses WireGuard. Prometheus and Grafana monitor the platform.</p>

    <p><code>GET /healthz</code> checks the application endpoint.</p></html>

    '
  healthz: 'ok

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-nginx
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  default.conf: "server {\n    listen       8080;\n    server_name  localhost;\n\n\
    \    location = /healthz {\n        root /usr/share/nginx/html;\n        default_type\
    \ text/plain;\n    }\n\n    location / {\n        root   /usr/share/nginx/html;\n\
    \        index  index.html index.htm;\n    }\n\n    error_page 500 502 503 504\
    \ /50x.html;\n    location = /50x.html {\n        root /usr/share/nginx/html;\n\
    \    }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: demo
        matchLabelKeys:
        - pod-template-hash
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:1.29.3-alpine
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: content
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: nginx-config
        configMap:
          name: demo-nginx
      - name: content
        configMap:
          name: demo-content
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  selector:
    app: demo
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-http
  namespace: demo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demo
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-https
  namespace: demo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  ingressClassName: traefik
  tls:
  - secretName: demo-tls
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demo
            port:
              name: http
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  defaultCertificate:
    secretName: demo-tls
